<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windfury — Numen Gym</title><style>body{margin:0;background:#172331;color:#eee;font:16px system-ui}header{padding:20px}button{padding:10px;margin-right:10px}canvas{display:block}pre{padding:20px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><header><h1>Windfury proc</h1><button id="proc">Trigger proc</button><button id="hold">Inspect swirl</button><button id="check">Run visual checks</button></header><canvas></canvas><pre id="report"></pre><script type="module">
import * as THREE from 'three';
import {makeCharacter,animateCharacter} from '../js/world/characters.js';
import {windfuryEffect} from '../js/world/windfury-fx.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();scene.background=new THREE.Color(0x172331);const camera=new THREE.PerspectiveCamera(40,1,.1,50);camera.position.set(3,2.7,4);camera.lookAt(0,1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x665544,3));const light=new THREE.DirectionalLight(0xffe5c5,3);light.position.set(3,5,3);scene.add(light);
const model=makeCharacter({race:'RaceOrc',classId:'shaman',gear:{mh:1,oh:null}});scene.add(model);const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x3b4958}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
let effect=null,held=false,last=performance.now();
function proc(hold=false){effect?.dispose();effect=windfuryEffect(scene,model);held=hold;effect.update(.16);if(!hold)model.userData.anim.mh=1;}
document.querySelector('#proc').onclick=()=>proc();document.querySelector('#hold').onclick=()=>proc(true);
document.querySelector('#check').onclick=()=>{const lines=[],check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);};try{const fx=windfuryEffect(scene,model);fx.update(.1);model.position.x=1;fx.update(.1);check(fx.group.position.x===1,'follows moving recipient');model.position.x=0;fx.group.traverse(o=>{if(o.geometry)check(Array.from(o.geometry.attributes.position.array).every(Number.isFinite),'finite ribbon geometry');});check(!fx.update(1),'expires');fx.dispose();check(!fx.group.parent,'scene cleanup');const death=windfuryEffect(scene,model);model.userData.anim.dead=true;check(!death.update(.01),'death clears effect');model.userData.anim.dead=false;death.dispose();const gone=windfuryEffect(scene,model);scene.remove(model);check(!gone.update(.01),'removed character clears effect');scene.add(model);gone.dispose();}catch(e){lines.push('FAIL '+e.message);}document.querySelector('#report').textContent=lines.join('\n');proc(true);};
function frame(now){requestAnimationFrame(frame);const dt=held?0:Math.min(.05,(now-last)/1000);last=now;animateCharacter(model,{dt,speed:0});if(effect&&!effect.update(dt)){effect.dispose();effect=null;}renderer.setSize(innerWidth,innerHeight*.72,false);camera.aspect=innerWidth/(innerHeight*.72);camera.updateProjectionMatrix();renderer.render(scene,camera);}proc(true);requestAnimationFrame(frame);
</script></body></html>
