<!doctype html><html><head><title>Customization checks</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><button id="run">Run customization checks</button><pre id="report">Ready</pre><script type="module">
import {buildPlayer,animateRig,RACE_LOOKS} from '../js/world/models.js';
import {customizationOptions,normalizeCustomization} from '../js/world/customization.js';
import {disposeCharacter} from '../js/world/characters.js';
document.querySelector('#run').onclick=async()=>{const lines=[];let pass=0,total=0;
for(const race of Object.keys(RACE_LOOKS).filter(r=>r.startsWith('Race')))for(const bodyType of ['body1','body2']){const opts=customizationOptions(race);for(let i=0;i<12;i++){const customization=Object.fromEntries(Object.entries(opts).filter(([k,v])=>v.length).map(([k,v])=>[k,v[i%v.length]]));let m;try{m=buildPlayer(race,null,{bodyType,customization});if(JSON.stringify(m.userData.customization)!==JSON.stringify(normalizeCustomization(customization,race)))throw Error('lost customization');for(const state of [{speed:0},{speed:1},{speed:0,air:true}]){animateRig(m,{dt:1/60,...state});m.updateMatrixWorld(true);m.traverse(o=>{if(!o.matrixWorld.elements.every(Number.isFinite))throw Error('invalid transform');if(o.geometry&&!Array.from(o.geometry.attributes.position.array).every(Number.isFinite))throw Error('invalid vertex');});}pass++;lines.push('PASS '+race+'/'+bodyType+'/'+i);}catch(e){lines.push('FAIL '+race+'/'+bodyType+'/'+i+' '+e.message);}finally{if(m)disposeCharacter(m);}total++;document.querySelector('#report').textContent=lines.join('\n');if(total%4===0)await new Promise(requestAnimationFrame);}}
document.querySelector('#report').textContent+='\n\n'+pass+'/'+total+' customization checks passed.';};
</script></body></html>
