<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music preview</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  body { font: 14px system-ui, sans-serif; background: #111; color: #ddd; margin: 16px; }
  h2 { font-size: 14px; color: #c9a14a; margin: 18px 0 6px; }
  button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 6px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  button.on { border-color: #c9a14a; color: #fff; }
  label { display: inline-flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<h1>Music preview</h1>
<p>Each encounter's music: in the Lofi style its song (js/music.js) and the lofi loop at the dummies, in the EDM style its
  raid's club track in its own key (js/edm.js). <label>Style <select id="style"><option value="lofi">Lofi</option><option value="edm">EDM</option><option value="radio">Radio Numen</option></select></label>
  <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.35"></label>
  <button id="stop">Stop</button></p>
<div id="list"></div>
<script type="module">
import { Sound, SOUND_DEFAULTS } from '../js/audio.js';
import { ENCOUNTERS } from '../js/world/encounter.js';
import { EdmPlayer, edmFor } from '../js/edm.js';
import { MODERN_TRACKS, ModernEdmPlayer } from '../js/edm-modern.js';
import { BAND_TRACKS, BandPlayer } from '../js/band.js';
import { BITES, SOUND_BITES } from '../js/data/radio.js';

const sound = new Sound({ ...SOUND_DEFAULTS, music: false });
const groups = {};
for (const [key, enc] of Object.entries(ENCOUNTERS)) (groups[enc.raid || 'Outdoors and dungeons'] ||= []).push([key, enc.name]);
const list = document.getElementById('list');
for (const [raid, encs] of Object.entries(groups)) {
  list.insertAdjacentHTML('beforeend', `<h2>${raid}</h2>`);
  for (const [key, name] of encs) {
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', () => {
      sound.setSong(key);
      sound.s.music = true;
      sound.unlock();
      document.querySelectorAll('#list button').forEach((x) => x.classList.toggle('on', x === b));
    });
    list.appendChild(b);
  }
}
// The dummies' EDM, one track at a time (the game shuffles them, a new one each round).
list.insertAdjacentHTML('beforeend', '<h2>Training dummies, EDM: each track (the game shuffles them)</h2>');
for (const [key, tr] of [['classic', { name: 'Training Floor', style: 'Classic' }], ...Object.entries(MODERN_TRACKS)]) {
  const b = document.createElement('button');
  b.textContent = `${tr.name} · ${tr.style}`;
  b.addEventListener('click', () => {
    sound.s.music = true;
    sound.s.musicStyle = 'edm';
    document.getElementById('style').value = 'edm';
    sound.unlock();
    if (sound.music) sound.music.stop(1);
    const player = key === 'classic' ? new EdmPlayer(sound.ctx, sound.musicBus, sound.noise, edmFor(null)) : new ModernEdmPlayer(sound.ctx, sound.musicBus, sound.noise, tr);
    sound.music = player;
    player.start();
    document.querySelectorAll('#list button').forEach((x) => x.classList.toggle('on', x === b));
  });
  list.appendChild(b);
}
// Radio Numen itself, the hosts and all: tune in, and skip to the next song to hear the next break.
list.insertAdjacentHTML('beforeend', '<h2>Radio Numen 104.2 (the hosts talk between songs)</h2><p id="radio-now" style="color:#e2507a"></p>');
const tune = document.createElement('button');
tune.textContent = '📻 Tune in';
tune.addEventListener('click', () => {
  sound.s.music = true;
  sound.s.musicStyle = 'radio';
  document.getElementById('style').value = 'radio';
  sound.onRadio = (ev) => {
    const now = document.getElementById('radio-now');
    if (!ev) now.textContent = '';
    else if (ev.type === 'song') now.textContent = `Now playing: ${ev.track.name} · ${ev.track.style}`;
    else if (ev.type === 'say') now.textContent = `${ev.who}: ${ev.text}`;
  };
  sound.unlock();
  sound.apply();
  document.querySelectorAll('#list button').forEach((x) => x.classList.toggle('on', x === tune));
});
const skip = document.createElement('button');
skip.textContent = '⏭ Next song';
skip.addEventListener('click', () => { if (sound.music && sound.music.player && sound.music.player.onRound) sound.music.player.onRound(); });
list.append(tune, skip);
// The sound bites on their own (tuning in first if the radio is off).
list.insertAdjacentHTML('beforeend', '<h2>Radio Numen: the sound bites</h2>');
BITES.forEach((bite, i) => {
  const b = document.createElement('button');
  const clip = bite.find(([who]) => who.startsWith('bite:'));
  b.textContent = `▶ ${SOUND_BITES[clip[0].slice(5)].name}: ${clip[0].slice(5)}`;
  b.addEventListener('click', () => {
    if (!(sound.music && sound.music.playBite)) tune.click();
    setTimeout(() => sound.music.playBite(i), 300);
  });
  list.appendChild(b);
});

// Radio Numen's band songs (rock, metal, blues, country, hip-hop), one at a time; the raps once recorded.
list.insertAdjacentHTML('beforeend', '<h2>Radio Numen: the band songs</h2>');
for (const [key, tr] of Object.entries(BAND_TRACKS)) {
  const b = document.createElement('button');
  b.textContent = `${tr.name} · ${tr.style}`;
  b.addEventListener('click', () => {
    sound.s.music = true;
    sound.unlock();
    if (sound.music) sound.music.stop(1);
    const player = new BandPlayer(sound.ctx, sound.musicBus, sound.noise, tr, key);
    sound.music = player;
    player.start();
    document.querySelectorAll('#list button').forEach((x) => x.classList.toggle('on', x === b));
  });
  list.appendChild(b);
}
document.getElementById('vol').addEventListener('input', (e) => { sound.s.musicVolume = Number(e.target.value); sound.apply(); });
document.getElementById('style').addEventListener('change', (e) => { sound.s.musicStyle = e.target.value; sound.apply(); });
document.getElementById('stop').addEventListener('click', () => { sound.s.music = false; sound.apply(); document.querySelectorAll('#list button').forEach((x) => x.classList.remove('on')); });
</script>
</body>
</html>
