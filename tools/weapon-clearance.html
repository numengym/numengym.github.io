<!doctype html><html><head><meta charset="utf-8"><title>Weapon clearance checks</title>
<style>body{background:#15202c;color:#eee;font:14px monospace;padding:24px}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body>
<h1>Weapon/body clearance</h1><button id="human">Check human bodies</button><button id="gnome">Check gnome bodies</button><button id="bows">Check bows on all races</button><button id="all">Check all races</button><pre id="report">Ready</pre>
<script type="module">
import * as THREE from 'three';
import {buildPlayer,animateRig,RACE_LOOKS} from '../js/world/models.js';
import {allowedClasses,starterOutfit} from '../js/world/appearance.js';

import {disposeCharacter} from '../js/world/characters.js';
const report=document.querySelector('#report');
const weapons=['crossbow','gun','bow','staff','polearm','2h-sword','2h-axe','2h-mace','sword','axe','mace','dagger','wand','thrown','shield','greataxe','starter-hammer'];
// Sample the actual mesh surfaces, including points between long stock/shaft vertices.
function weaponSamples(w) {
  const points=[],keys=new Set();w.updateWorldMatrix(true,true);const inverse=w.matrixWorld.clone().invert();
  w.traverse(o=>{if(!o.isMesh)return;const p=o.geometry.attributes.position,idx=o.geometry.index,mat=inverse.clone().multiply(o.matrixWorld);
    const add=v=>{v.applyMatrix4(mat);const key=v.toArray().map(n=>Math.round(n*50)).join(',');if(!keys.has(key)){keys.add(key);points.push(v);}};
    for(let i=0;i<p.count;i+=Math.max(1,Math.floor(p.count/160)))add(new THREE.Vector3().fromBufferAttribute(p,i));
    const count=idx?idx.count:p.count;
    for(let i=0;i<count;i+=3*Math.max(1,Math.floor(count/300))) {
      const a=new THREE.Vector3().fromBufferAttribute(p,idx?idx.getX(i):i),b=new THREE.Vector3().fromBufferAttribute(p,idx?idx.getX(i+1):i+1),c=new THREE.Vector3().fromBufferAttribute(p,idx?idx.getX(i+2):i+2);
      for(const t of [.25,.5,.75]) {add(a.clone().lerp(b,t));add(a.clone().lerp(c,t));}
      add(a.clone().add(b).add(c).multiplyScalar(1/3));
    }
  });return points;
}
function torsoRows(mesh) {
  const map=new Map(),p=mesh.geometry.attributes.position;
  for(let i=0;i<p.count;i++){const y=p.getY(i),key=y.toFixed(5);if(!map.has(key))map.set(key,{y,points:[]});map.get(key).points.push([p.getX(i),p.getZ(i)]);}
  return [...map.values()].sort((a,b)=>a.y-b.y);
}
function insideTorso(p,rows) {
  if(p.y<=rows[0].y+.01||p.y>=rows.at(-1).y-.01)return false;
  let lo=0,hi=rows.length-1;while(hi-lo>1){const mid=(lo+hi)>>1;if(rows[mid].y<p.y)lo=mid;else hi=mid;}
  const a=rows[lo],b=rows[hi],t=(p.y-a.y)/(b.y-a.y);let inside=false;
  for(let i=0,j=a.points.length-1;i<a.points.length;j=i++) {
    const x1=THREE.MathUtils.lerp(a.points[i][0],b.points[i][0],t)*.97,z1=THREE.MathUtils.lerp(a.points[i][1],b.points[i][1],t)*.97;
    const x2=THREE.MathUtils.lerp(a.points[j][0],b.points[j][0],t)*.97,z2=THREE.MathUtils.lerp(a.points[j][1],b.points[j][1],t)*.97;
    if((z1>p.z)!==(z2>p.z)&&p.x<(x2-x1)*(p.z-z1)/(z2-z1)+x1)inside=!inside;
  }return inside;
}
function obstacles(model) {
  const j=model.userData.rig,torso=j.spine.children.find(o=>o.isMesh),skeleton=model.userData.transform==='noggenfogger',rows=skeleton?null:torsoRows(torso);
  const volumes=[{name:'torso',node:skeleton?j.spine:torso,inside:p=>skeleton?(p.x/.21)**2+((p.y-.28)/.23)**2+((p.z-.025)/.13)**2<1:insideTorso(p,rows)},
    {name:'head',node:j.head,inside:p=>(p.x/.16)**2+((p.y-.025)/.19)**2+(p.z/.14)**2<1},
    {name:'pelvis',node:j.hips,inside:p=>(p.x/.20)**2+((p.y+.025)/.12)**2+(p.z/.085)**2<1}];
  if(j.skirt){const skirt=torsoRows(j.skirt);volumes.push({name:'robe',node:j.skirt,inside:p=>insideTorso(p,skirt)});}
  for(const side of ['L','R'])for(const [part,len,radius] of [['shoulder',.29,model.userData.bodyType==='body2'?.05:.07],['elbow',.18,model.userData.bodyType==='body2'?.03:.04]])volumes.push({name:part+side,node:j[part+side],inside:p=>p.y<-.045&&p.y>-len+.025&&(p.x*p.x+p.z*p.z)<radius*radius});
  for(const side of ['L','R'])for(const [part,len,radius] of [['thigh',.44,.085],['knee',.4,.055]])volumes.push({name:part+side,node:j[part+side],inside:p=>p.y<-.035&&p.y>-len+.035&&(p.x*p.x+p.z*p.z)<radius*radius});
  return volumes;
}
async function run(all,subset='RaceHuman',only=null) {
  document.querySelectorAll('button').forEach(b=>b.disabled=true);const lines=[];let failed=0,total=0;
  const races=all?Object.keys(RACE_LOOKS).filter(r=>r.startsWith('Race')):[subset];
  const poses=[['idle',{},{}],['run',{speed:1},{}],['backpedal',{speed:-1},{}],['strafe',{speed:1,strafe:1},{}],['jump',{air:true},{}],['combat',{combat:true},{}],['attack',{combat:true},{mh:1}],['offhand',{combat:true},{oh:1}],['spin',{combat:true},{spin:1}],['hit',{}, {hit:1}],['cheer',{}, {cheer:1}],['death',{}, {dead:true}]];
  const cases=[];
  for(const race of races)for(const bodyType of ['body1','body2']) {
    for(const kind of weapons)cases.push({race,bodyType,kind});
    const robeClass=allowedClasses(race).find(c=>starterOutfit(race,c,bodyType).skirt);
    if(robeClass)for(const kind of ['staff','polearm','2h-mace'])cases.push({race,bodyType,kind,classId:robeClass});
  }
  if(all)for(const kind of weapons)cases.push({race:'RaceHuman',bodyType:'body1',kind,transform:'noggenfogger'});
  for(const {race,bodyType,kind,classId,transform} of cases) {
    if(only&&kind!==only)continue;
    const model=buildPlayer(race,{mh:kind==='shield'?'sword':kind,oh:kind==='shield'?'shield':['sword','axe','mace','dagger'].includes(kind)?kind:null},{bodyType,classId,transform}),j=model.userData.rig,a=model.userData.anim;
    const held=['R','L'].filter(s=>j['weapon'+s]).map(s=>({w:j['weapon'+s],samples:weaponSamples(j['weapon'+s])})),volumes=obstacles(model);
    const hits=new Set();let firstHit='';
    for(const [pose,state,triggers]of poses) {
      Object.assign(a,{mh:0,oh:0,ranged:0,spin:0,hit:0,cheer:0,dead:false,move:0,combat:0,t:0,walk:0},triggers);
      for(let frame=0;frame<72;frame++) {
        animateRig(model,{dt:1/60,speed:0,combat:false,...state});if(frame%8!==0)continue;model.updateWorldMatrix(true,true);
        if(model.userData.twoHand&&!a.dead){
          const w=j.weaponR,grip=w.userData.kind==='bow'?new THREE.Vector3(0,0,w.userData.string.geometry.attributes.position.getZ(1)):w.userData.ranged?w.userData.supportGrip.clone():new THREE.Vector3(0,.06,-.06);
          const target=j.spine.worldToLocal(w.localToWorld(grip)),hand=j.spine.worldToLocal(j.wristL.getWorldPosition(new THREE.Vector3()));
          if(hand.distanceTo(target)>.08)hits.add(pose+'/support-grip');
        }
        for(const {w,samples}of held)if(w.visible)for(const v of volumes) {
          const mat=v.node.matrixWorld.clone().invert().multiply(w.matrixWorld);
          const point=samples.find(p=>v.inside(p.clone().applyMatrix4(mat)));
          if(point){hits.add(pose+'/'+v.name);if(!firstHit)firstHit=' [first contact: weapon '+point.toArray().map(n=>n.toFixed(3)).join(',')+'; '+v.name+' '+point.clone().applyMatrix4(mat).toArray().map(n=>n.toFixed(3)).join(',')+']';}
        }
      }
    }
    total++;if(hits.size)failed++;lines.push((hits.size?'FAIL ':'PASS ')+race+'/'+bodyType+'/'+kind+(classId?' / '+classId:'')+(transform?' / '+transform:'')+(hits.size?' — '+[...hits].join(', ')+firstHit:''));
    disposeCharacter(model);report.textContent=lines.join('\n');if(total%8===0)await new Promise(requestAnimationFrame);
  }
  report.textContent+='\n\n'+(total-failed)+'/'+total+' clearance cases passed.';document.querySelectorAll('button').forEach(b=>b.disabled=false);
}

document.querySelector('#human').onclick=()=>run(false);document.querySelector('#gnome').onclick=()=>run(false,'RaceGnome');document.querySelector('#all').onclick=()=>run(true);
document.querySelector('#bows').onclick=()=>run(true,'RaceHuman','bow');
</script></body></html>
