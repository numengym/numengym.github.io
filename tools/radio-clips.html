<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radio Numen clips</title>
</head>
<body>
<!-- Every clip Radio Numen can play (js/radio.js allClips), as JSON for tools/radio-voices.ps1, which reads this page
     through a headless browser from the dev server: { hosts: { who: { voice, speed, instructions } }, numberNote, clips:
     [[file, who, text, isNumberWord?]] }. -->
<pre id="clips"></pre>
<script type="module">
import { allClips } from '../js/radio.js';
import { HOSTS } from '../js/data/radio.js';
import { RAPPERS } from '../js/band.js';

const hosts = Object.fromEntries(Object.entries({ ...HOSTS, ...RAPPERS }).map(([k, h]) => [k, { voice: h.voice, speed: h.speed || 1, instructions: h.instructions }]));
const clips = allClips().map((c) => (c.file.startsWith('num-') ? [c.file, c.who, c.text, 1] : [c.file, c.who, c.text]));
document.getElementById('clips').textContent = JSON.stringify({ hosts, numberNote: 'Say just this one word, as part of reading out a number.', clips });
</script>
</body>
</html>
