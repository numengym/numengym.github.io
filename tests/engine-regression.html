<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine regression</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #111; color: #ddd; }
  pre { background: #1b1b1b; padding: 10px; overflow: auto; }
</style>
</head>
<body>
<h1>Engine regression</h1>
<p>Fixed-dice bot fights for each spec and fight mode. The engine is unchanged when the numbers are identical to the
saved baseline. <code>window.engineRegression()</code> returns them; <code>window.engineBaseline</code> is the saved set.</p>
<pre id="out">running…</pre>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import { computeSheet } from '../js/character.js';
import { SPECS } from '../js/data/specs.js';
import { suggest } from '../js/apl.js';
import { prepullAndPull } from '../js/score.js';
import { createFight } from '../js/engine/fight.js';

// Each case: a spec and fight options on top of the defaults. Five fixed seeds per case.
const CASES = [
  ['fury', {}], ['arms', {}],
  ['fury', { targets: 3 }], ['arms', { targets: 3 }],
  ['fury', { end: 'health', health: 40000 }], ['fury', { end: 'never', execute: 'always', duration: 60 }],
  ['fury', { hitEvery: 2 }], ['arms', { moveEvery: 20, moveFor: 5 }],
];

function fightOnce(spec, extra, seed) {
  const sp = SPECS[spec];
  const lo = structuredClone(sp.loadout);
  const { sheet, gear } = computeSheet(lo, { zone: 'mountHyjal' });
  const items = {};
  for (const g of gear) if (g.slot === 12 || g.slot === 13) items[g.id] = g.slot === 12 ? 'trinket1' : 'trinket2';
  if (lo.consumables.explosiveId) items[lo.consumables.explosiveId] = 'explosive';
  let s = seed >>> 0;
  const rng = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const opts = { duration: 120, targets: 1, startRage: 0, queueWindow: 0.4, precastShout: true, startStance: sp.startStance, end: 'time', execute: 'last20', ...extra };
  const f = createFight(sheet, opts, rng);
  prepullAndPull(f, sp.apl, items);
  let away = false;
  const stopAt = opts.end === 'never' ? opts.duration : Infinity;
  while (!f.over && f.t < stopAt) {
    if (!!f.moveWindow(f.t) !== away) { away = !away; f.geo = { ...f.geo, dist: f.geo.dist.map(() => (away ? 10 : 0)) }; }
    const h = suggest(f, sp.apl, { items });
    for (const id of h.now) f.press(id);
    if (h.next && f.gcdLeft() <= 0) f.press(h.next);
    f.advance(f.t + 0.05);
  }
  if (!f.over) f.stop();
  return Math.round(f.dps() * 1000) / 1000;
}

window.engineRegression = () => CASES.map(([spec, extra]) => ({
  case: `${spec} ${JSON.stringify(extra)}`,
  dps: [11, 22, 33, 44, 55].map((seed) => fightOnce(spec, extra, seed)),
}));

const result = window.engineRegression();
const baseline = await (await fetch('./engine-baseline.json', { cache: 'no-store' })).json();
window.engineBaseline = baseline;
const diffs = result.flatMap((r, i) => r.dps.map((v, k) => (baseline[i] && baseline[i].dps[k] === v ? null : `${r.case} seed ${k}: ${v} (baseline ${baseline[i] && baseline[i].dps[k]})`))).filter(Boolean);
window.engineResult = result;
window.engineDiffs = diffs;
document.getElementById('out').textContent = (diffs.length ? `CHANGED (${diffs.length}):\n${diffs.join('\n')}` : 'SAME AS BASELINE') + '\n\n' + JSON.stringify(result, null, 1);
</script>
</body>
</html>
